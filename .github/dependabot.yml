# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
    # Specify a name for the group, which will be used in pull request titles
    # and branch names
      # Minor and patch updates only. Major versions are left out of the group on purpose: each
      # one arrives as its own PR, so a single breaking upgrade no longer holds back every
      # routine update in the same batch (the dependency bot merges these; majors wait for a
      # human, with an analysis attached).
      deps:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
