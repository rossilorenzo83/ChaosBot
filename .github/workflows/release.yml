name: Maven Release & GitHub Deployment

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch to checkout when cutting the release."
        required: true
        default: "main"  # Can be overridden via environment variable or repository settings
      releaseVersion:
        description: "Version to release (e.g., 0.0.2)."
        required: true
        default: "0.0.2"
      developmentVersion:
        description: "Next development version (e.g., 0.0.3-SNAPSHOT)."
        required: true
        default: "0.0.3-SNAPSHOT"
      dryRun:
        description: "Dry run for release? (true/false)"
        required: true
        default: "false"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # Can be overridden via repository secrets or environment variables
      DEFAULT_BRANCH: ${{ vars.DEFAULT_BRANCH || 'main' }}

    steps:
    - name: Get Default Branch
      id: get_default_branch
      run: |
        # Try to get the default branch from GitHub API
        DEFAULT_BRANCH=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}" | \
          jq -r '.default_branch // "main"')
        echo "default_branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
        echo "Using default branch: $DEFAULT_BRANCH"

    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || steps.get_default_branch.outputs.default_branch }}
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set Git User
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"

    - name: Generate Changelog
      id: changelog
      run: |
        # Get the latest release tag
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -z "$LATEST_TAG" ]; then
          # No previous releases, get all commits
          CHANGELOG=$(git log --oneline --pretty=format:"- %s" | head -20)
        else
          # Get commits since last release
          CHANGELOG=$(git log --oneline --pretty=format:"- %s" ${LATEST_TAG}..HEAD)
        fi
        
        # If no commits found, use default message
        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="- Automated release via GitHub Actions"$'\n'"- Enhanced build system"$'\n'"- Improved CI/CD pipeline"
        fi
        
        # Escape newlines for GitHub Actions
        CHANGELOG="${CHANGELOG//'%'/'%25'}"
        CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
        CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
        
        echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
        echo "Generated changelog:"
        echo "$CHANGELOG"

    - name: Build with Maven (including tests)
      run: mvn -B clean verify

    - name: Prepare Release with Maven
      run: >
        mvn -B release:prepare
        -DreleaseVersion=${{ github.event.inputs.releaseVersion }}
        -DdevelopmentVersion=${{ github.event.inputs.developmentVersion }}
        -DdryRun=${{ github.event.inputs.dryRun }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Perform Release with Maven
      if: ${{ github.event.inputs.dryRun != 'true' }}
      run: mvn -B release:perform
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release
      if: ${{ github.event.inputs.dryRun != 'true' }}
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: "v${{ github.event.inputs.releaseVersion }}"
        release_name: "ChaosBot ${{ github.event.inputs.releaseVersion }}"
        draft: false
        prerelease: false
        body: |
          ## ChaosBot ${{ github.event.inputs.releaseVersion }}
          
          ### What's New
          ${{ steps.changelog.outputs.changelog }}
          
          ### Installation
          Download the JAR file and run with:
          ```bash
          java -jar chaos-conquest-bot-${{ github.event.inputs.releaseVersion }}.jar
          ```

    - name: Upload Release Asset
      if: ${{ github.event.inputs.dryRun != 'true' }}
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./target/chaos-conquest-bot-${{ github.event.inputs.releaseVersion }}.jar
        asset_name: chaos-conquest-bot-${{ github.event.inputs.releaseVersion }}.jar
        asset_content_type: application/java-archive

    - name: Verify Release
      if: ${{ github.event.inputs.dryRun != 'true' }}
      run: |
        echo "Release v${{ github.event.inputs.releaseVersion }} created successfully!"
        echo "Download URL: https://github.com/${{ github.repository }}/releases/tag/v${{ github.event.inputs.releaseVersion }}"
