# One click releases ChaosBot: Actions -> Release -> Run workflow, choose patch / minor / major (or type a version).
#
# The version is not stored in pom.xml (it says ${revision}, 0-SNAPSHOT by default), so a release needs no pull
# request: this workflow computes the next version from the last vX.Y.Z tag, builds and tests with
# -Drevision=X.Y.Z, then creates the tag on the commit it built and the GitHub release with the JAR and notes
# generated from the merged pull requests. See BUILD.md, "Release Process".

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the last version to increase"
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: "Exact version instead (e.g. 1.0.0); leave empty to use the bump"
        required: false
        default: ""

permissions:
  contents: write   # create the tag and the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Releases come from main
      if: github.ref != 'refs/heads/main'
      run: |
        echo "::error::Run the release from main (it was started on $GITHUB_REF)."
        exit 1

    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags, to find the last version

    - name: Work out the version
      id: version
      env:
        BUMP: ${{ inputs.bump }}
        EXACT: ${{ inputs.version }}
      run: |
        last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
        last=${last#v}; last=${last:-0.0.0}
        if [ -n "$EXACT" ]; then
          version="${EXACT#v}"
        else
          IFS=. read -r major minor patch <<< "$last"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            *)     version="$major.$minor.$((patch + 1))" ;;
          esac
        fi
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$version' is not a version like 1.2.3"; exit 1
        fi
        if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
          echo "::error::v$version already exists"; exit 1
        fi
        echo "Last release: ${last}, releasing: ${version}"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # The same commands as the Build and Test job in maven.yml (UtilsUnitTest needs a display).
    - name: Run Unit Tests
      run: mvn -B test "-Dtest=!*UtilsUnitTest*" -DfailIfNoTests=false -Drevision=${{ steps.version.outputs.version }}

    - name: Run Integration Tests
      run: mvn -B verify -DskipUnitTests -Drevision=${{ steps.version.outputs.version }}

    - name: Package
      run: mvn -B package -DskipTests -Drevision=${{ steps.version.outputs.version }}

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        jar="target/chaos-conquest-bot-${VERSION}.jar"
        test -f "$jar" || { echo "::error::$jar was not built"; ls target; exit 1; }
        gh release create "v${VERSION}" "$jar" \
          --target "$GITHUB_SHA" \
          --title "ChaosBot ${VERSION}" \
          --generate-notes
        echo "### Released ChaosBot ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
        echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
