# Publishes a GitHub release when a version tag is pushed: `git tag v1.2.0 <commit> && git push origin v1.2.0`.
#
# The version is bumped in pom.xml by a normal pull request first (main only accepts changes through PRs, which
# is why this no longer uses the Maven Release Plugin: release:prepare pushes commits straight to main, and the
# release.properties it left behind in 2022 made every later attempt resume a release of 0.0.1-alpha).
# See BUILD.md, "Release Process".

name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write   # create the release and upload the JAR

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Check the tag matches pom.xml
      run: |
        tag="${GITHUB_REF_NAME#v}"
        pom=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
        echo "tag: $tag, pom.xml: $pom"
        if [ "$tag" != "$pom" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match version $pom in pom.xml. Bump pom.xml in a PR first."
          exit 1
        fi
        case "$pom" in *-SNAPSHOT) echo "::error::Refusing to release a SNAPSHOT version"; exit 1;; esac

    # The same commands as the Build and Test job in maven.yml (UtilsUnitTest needs a display).
    - name: Run Unit Tests
      run: mvn -B test "-Dtest=!*UtilsUnitTest*" -DfailIfNoTests=false

    - name: Run Integration Tests
      run: mvn -B verify -DskipUnitTests

    - name: Package
      run: mvn -B package -DskipTests

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version="${GITHUB_REF_NAME#v}"
        jar="target/chaos-conquest-bot-${version}.jar"
        test -f "$jar" || { echo "::error::$jar was not built"; ls target; exit 1; }
        gh release create "$GITHUB_REF_NAME" "$jar" \
          --verify-tag \
          --title "ChaosBot ${version}" \
          --generate-notes
