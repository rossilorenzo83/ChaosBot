# Keeps the OWASP Dependency Check database (NVD) in the Actions cache, so that the Security Scan in
# maven.yml restores it instead of downloading ~400,000 CVEs from the NVD API on every run.
#
# The first run downloads everything and can take hours when the NVD API is slow; every run after
# that only fetches what changed since the day before. Running daily also keeps the cache from
# expiring (GitHub evicts caches unused for 7 days).

name: NVD database

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to delete the superseded database caches

concurrency:
  group: nvd-cache
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh NVD database
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Restore NVD database
      uses: actions/cache/restore@v4
      with:
        path: ~/.dependency-check/data
        key: nvd-db-${{ github.run_id }}
        restore-keys: nvd-db-

    - name: Update NVD database
      run: mvn -B org.owasp:dependency-check-maven:update-only
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN"

    - name: Save NVD database
      uses: actions/cache/save@v4
      with:
        path: ~/.dependency-check/data
        key: nvd-db-${{ github.run_id }}

    - name: Delete superseded NVD databases
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --key nvd-db- --limit 100 --json id,key \
          --jq '.[] | select(.key != "nvd-db-${{ github.run_id }}") | .id' \
          | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
