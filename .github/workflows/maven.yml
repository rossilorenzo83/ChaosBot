# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    # Only main: a branch with a PR is already built by the pull_request event. Pushing every
    # branch ran the whole pipeline twice per Dependabot PR, two NVD downloads on one API key.
    branches: [ main ]
  pull_request:
    branches: [ "**" ]  # Trigger on PRs to any branch

# A new commit on a PR supersedes the run of the previous one; main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default least-privilege token for every job. The security-scan job
# overrides this with `contents: write` to submit the dependency graph.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better analysis

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Validate POM
      run: mvn -B validate

    - name: Compile Source Code
      run: mvn -B compile

    - name: Run Unit Tests
      run: mvn -B test -Dtest="!*UtilsUnitTest*" -DfailIfNoTests=false
      env:
        # Enable test reporting and handle platform-specific tests
        MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
        # Skip Windows-specific tests on Linux runners
        SKIP_WINDOWS_TESTS: true

    - name: Run Integration Tests
      run: mvn -B verify -DskipUnitTests
      env:
        MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN

    - name: Build Package
      run: mvn -B package -DskipTests

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/failsafe-reports/
          target/site/jacoco/

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: target/*.jar

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: target/

    - name: Run Static Analysis
      run: mvn -B spotbugs:check

    - name: Run Dependency Analysis
      run: mvn -B dependency:analyze

    - name: Check for Dependency Updates
      run: mvn -B versions:display-dependency-updates

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    # OSV-Scanner queries osv.dev (GitHub Advisory Database, NVD-derived records, ecosystem feeds)
    # per dependency: about 20 seconds, no API key. The OWASP Dependency Check it replaces had to
    # download the whole NVD database through the NVD API first, which took longer than GitHub's
    # 6-hour limit whenever the NVD was slow.
    timeout-minutes: 10
    # Required permissions for dependency submission
    permissions:
      contents: write

    env:
      OSV_SCANNER_VERSION: v2.7.0
      # Fail on any vulnerability scored at or above this CVSS (what <failOnCVSS>7</failOnCVSS> in
      # pom.xml meant; that parameter name was never read by the plugin).
      FAIL_ON_CVSS: 7

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Install OSV-Scanner
      run: |
        base="https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}"
        curl -sSfL -o osv-scanner_linux_amd64 "$base/osv-scanner_linux_amd64"
        curl -sSfL -o SHA256SUMS "$base/osv-scanner_SHA256SUMS"
        grep ' osv-scanner_linux_amd64$' SHA256SUMS | sha256sum -c -
        install -m 755 osv-scanner_linux_amd64 /usr/local/bin/osv-scanner
        rm osv-scanner_linux_amd64 SHA256SUMS

    - name: Scan dependencies for known vulnerabilities
      run: |
        # Exit code 1 means "vulnerabilities found", which the next step judges by severity;
        # anything else is a scanner failure.
        set +e
        osv-scanner scan source -r --format json . > osv-results.json
        code=$?
        set -e
        if [ "$code" -gt 1 ]; then echo "::error::osv-scanner failed (exit $code)"; exit "$code"; fi

    - name: Fail on severity ${{ env.FAIL_ON_CVSS }} or higher
      run: |
        jq -r '[.results[]?.packages[]? as $p | $p.groups[]?
                | {pkg: "\($p.package.name) \($p.package.version)", sev: (.max_severity // ""), ids: (.ids | join(", "))}]
               | sort_by(.sev | tonumber? // -1) | reverse
               | (["| CVSS | Package | Advisories |", "|---|---|---|"] + map("| \(if .sev == "" then "?" else .sev end) | \(.pkg) | \(.ids) |"))
               | .[]' osv-results.json > findings.md
        count=$(( $(wc -l < findings.md) - 2 ))
        {
          echo "### Known vulnerabilities in dependencies: $count"
          if [ "$count" -gt 0 ]; then cat findings.md; fi
        } >> "$GITHUB_STEP_SUMMARY"
        severe=$(jq --argjson t "$FAIL_ON_CVSS" \
          '[.results[]?.packages[]?.groups[]? | (.max_severity // "" | tonumber? // 0) | select(. >= $t)] | length' \
          osv-results.json)
        if [ "$severe" -gt 0 ]; then
          echo "::error::$severe vulnerabilit(y/ies) with CVSS >= $FAIL_ON_CVSS; see the run summary"
          exit 1
        fi

    - name: Upload Security Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-report
        path: osv-results.json

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    # Only runs on push events (not PRs) because PRs have limited token permissions
    - name: Update dependency graph
      if: github.event_name == 'push'
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
