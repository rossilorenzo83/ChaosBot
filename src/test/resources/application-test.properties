# Test-specific configuration for ChaosBot
# This file contains test-specific properties that override the main application.properties

# Disable Discord integration for tests
general.postDryRun=true

# Use test-specific process names
general.pidName=test-process

# Use test window names
general.windowsNames[0]=TestWindow

# Faster action intervals for tests
general.actionIntervalMs=1000

# Test action type
general.actionType=RSS_FARMING

# Test language
general.gameLanguage=en

# Lower image quality threshold for tests
general.imageQualityLowerBound=0.5

# Test march configuration
farm.marchesAvailable=1
farm.marchesIntervalMins=1
farm.targetArmyLevel=1
farm.targetRssLevel=1
farm.rssType=IRON

# Test Discord configuration (dummy values)
discord.channelId=test-channel-id
discord.botAuthToken=test-bot-token

# Logging configuration for tests
logging.level.com.lr=DEBUG
logging.level.org.springframework=INFO
logging.level.org.apache.maven=WARN 